<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="./style.css" rel="stylesheet">
</head>
<body>
    <div class="login">
        <div class="login__hero">
            <img src="./images/dude.png" alt="Dude">
            <h1 class="login__title">Войти</h1>
        </div>
        <div class="login__form-wrapper">
            <form class="login__form" action="" method="get">
                <div class="login__field">
                    <label class="login__label" for="email">Электронная почта</label>
                    <input class="login__input" type="email" id="email" name="email">
                    <span class="login__hint">Введите электропочту в формате *****@***.**</span>
                </div>
                <div class="login__field">
                    <label class="login__label" for="password">Пароль</label>
                    <input class="login__input" type="password" id="password" name="password">
                </div>
                <button class="login__button" type="button">Продолжить</button>
            </form>
        </div>
    </div>
</body>
</html>
